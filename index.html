<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代辦事項</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #eee;
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #999; }
    li .delete {
      background: transparent;
      color: #999;
      padding: 4px 8px;
      font-size: 1.1rem;
      line-height: 1;
    }
    li .delete:hover { background: #fee2e2; color: #dc2626; }
    .empty { text-align: center; color: #999; padding: 24px 0; }
    .footer {
      margin-top: 12px;
      font-size: 0.875rem;
      color: #666;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>代辦事項</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="輸入待辦事項後按 Enter" autocomplete="off" required>
      <button type="submit">新增</button>
    </form>
    <ul id="todo-list"></ul>
    <div class="footer" id="todo-count"></div>
  </main>

  <script>
    const STORAGE_KEY = 'todos';
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('todo-count');

    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch {
        // 儲存空間不可用（例如隱私模式）時，僅保留在記憶體中
      }
    }

    function render() {
      list.innerHTML = '';

      if (todos.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '目前沒有待辦事項';
        list.appendChild(empty);
        count.textContent = '';
        return;
      }

      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = todo.done ? 'done' : '';
        li.dataset.id = todo.id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', '完成 ' + todo.text);
        checkbox.addEventListener('change', () => toggle(todo.id));

        const span = document.createElement('span');
        span.textContent = todo.text;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete';
        del.textContent = '×';
        del.setAttribute('aria-label', '刪除 ' + todo.text);
        del.addEventListener('click', () => remove(todo.id));

        li.append(checkbox, span, del);
        list.appendChild(li);
      });

      const remaining = todos.filter((t) => !t.done).length;
      count.textContent = `${remaining} 項未完成 / 共 ${todos.length} 項`;
    }

    function add(text) {
      todos.push({ id: Date.now(), text, done: false });
      save();
      render();
    }

    function toggle(id) {
      todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter((t) => t.id !== id);
      save();
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text);
      input.value = '';
      input.focus();
    });

    render();
  </script>
</body>
</html>
